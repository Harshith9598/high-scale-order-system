name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & unit test
        run: mvn -B -ntp clean verify -Dtest=OrderStatusTest,ProductServiceTest,IdempotencyServiceTest -Dsurefire.useFile=false

      - name: Package (skip tests)
        run: mvn -B -ntp package -DskipTests

      - name: Docker build
        run: docker build -t high-scale-order-system:ci .
