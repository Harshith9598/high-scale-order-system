name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Unit tests only: Testcontainers suites are excluded by name and run in
      # the integration job, where Docker is available.
      - name: Compile + unit tests
        run: ./mvnw -B -ntp verify -Dtest='!OrderIntegrationTest,!ConcurrentOrderTest,!FlywayMigrationV1ToV2Test' -Dsurefire.useFile=true
      - name: Docker build
        run: docker build -t high-scale-order-system:ci .

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Testcontainers integration + concurrency tests
        run: ./mvnw -B -ntp test -Dtest=OrderIntegrationTest,ConcurrentOrderTest,FlywayMigrationV1ToV2Test -Dsurefire.useFile=true
      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
