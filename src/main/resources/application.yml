server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: order-platform
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DATABASE_USERNAME:orderuser}
    password: ${DATABASE_PASSWORD:orderpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc.lob.non_contextual_creation: true
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: order-platform-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ordersystem.kafka.event"
        spring.json.value.default.type: com.ordersystem.kafka.event.OrderCreatedEvent
        max.poll.records: 50
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate
      concurrency: 3

  cache:
    type: redis
    redis:
      time-to-live: 600000

app:
  jwt:
    # No default: the app must not start with a signing key that is public in
    # git history. Generate one: openssl rand -base64 48  (docker-compose
    # supplies a clearly-labelled dev-only value for local use).
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  outbox:
    polling-interval-ms: 5000
    batch-size: 100
    max-retries: 10
    processing-timeout: PT5M
  kafka:
    topics:
      order-created: order.created
      inventory-reserved: inventory.reserved
      inventory-failed: inventory.failed
      payment-processed: payment.processed
      payment-failed: payment.failed
      order-completed: order.completed
      notification-created: notification.created
      order-created-dlt: order.created.DLT
      inventory-reserved-dlt: inventory.reserved.DLT
      payment-processed-dlt: payment.processed.DLT
      notification-created-dlt: notification.created.DLT
  payment:
    failure-rate: 0.05
    processing-delay-ms: 100

management:
  endpoints:
    web:
      exposure:
        # Never expose env/beans over HTTP: they leak configuration and secrets.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.ordersystem: INFO
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"
